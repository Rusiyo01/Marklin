name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests en el PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocolo CAN y motor de scripts
        run: make -C firmware/test_host

  firmware:
    name: Firmware ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32-s3, esp32-c3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Instalar PlatformIO
        run: pip install platformio
      - name: Compilar
        run: pio run -d firmware -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/.pio/build/${{ matrix.env }}/bootloader.bin
            firmware/.pio/build/${{ matrix.env }}/partitions.bin
