; Firmware ESP32 para controlar trenes Märklin a través del bus CAN de la
; Gleisbox (60113/60116) que acompaña a la Mobile Station 2.
;
;   pio run                     compilar (placa por defecto: esp32dev)
;   pio run -t upload           grabar
;   pio device monitor          consola serie (115200 baudios)
;   pio run -e esp32-s3 -t upload   otra placa

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
; App grande (con hueco para OTA) y ~190 KB para guardar scripts.
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    ; En el ESP32-C3 el botón BOOT está en el GPIO 9.
    -DDEFAULT_ESTOP_PIN=9
